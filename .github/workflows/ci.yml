name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API/core and development dependencies
        run: uv sync --locked
      - name: Verify published audit pack
        run: uv run python scripts/verify_audit.py
      - name: Verify public release tree
        run: uv run python scripts/verify_release.py
      - name: Test
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Build and inspect distributions
        run: |
          uv build
          uv run python scripts/verify_distribution.py
