[project]
name = "vlm-eval-bench"
version = "0.1.0"
description = "Config-driven VLM evaluation harness: fine-tuned local Qwen3-VL vs commercial API models on document understanding (DocVQA / ChartQA / CORD-v2)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "kuotunyu", email = "61350295+kuotunyu@users.noreply.github.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=4.3.0",
    "pillow>=12.0",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "numpy>=1.26",
    "rapidfuzz>=3.0",
    "matplotlib>=3.9",
    "google-genai>=1.0",
    "openai>=1.60",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Local GPU inference (RTX 4090, WSL). Not needed for API-only runs.
# Versions aligned with the sibling vlm-receipt-extractor project.
local = [
    "unsloth>=2026.6.9",
    "transformers>=5.5.0",
    "peft>=0.19.1",
    "bitsandbytes>=0.49.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlmeval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
line-ending = "lf"
